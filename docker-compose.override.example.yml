# ═══════════════════════════════════════════════════════════════
# Dev overrides — copy to docker-compose.override.yml
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# docker compose up          → merges override → dev profile
# docker compose -f docker-compose.yml up → prod profile only
# ═══════════════════════════════════════════════════════════════
services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: dev
