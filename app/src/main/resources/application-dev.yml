cookie:
  secure: false

spring:
  datasource:
    url: jdbc:h2:mem:sc_kpi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

rate-limit:
  rules-cache-ttl-seconds: 5

feature-flags:
  cache-ttl-seconds: 5
  defaults:
    auth.oauth2.google: true
    auth.password-reset: true
    auth.registration: true
    notifications.telegram: false
    engagements.clubs: true
    engagements.projects: true
    council.departments: true
    documents.management: true
    user.partner-levels: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,mappings,scheduledtasks,conditions
  endpoint:
    health:
      show-details: always
    env:
      show-values: WHEN_AUTHORIZED
