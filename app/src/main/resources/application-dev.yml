spring:
  datasource:
    url: jdbc:h2:mem:sc_kpi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,mappings,scheduledtasks,conditions
  endpoint:
    health:
      show-details: always
    env:
      show-values: WHEN_AUTHORIZED
