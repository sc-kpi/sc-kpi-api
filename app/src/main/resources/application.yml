spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: sc-kpi-api
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgZGV2ZWxvcG1lbnQgcHVycG9zZXMgb25seQ==}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  remember-me-refresh-expiration: ${JWT_REMEMBER_ME_REFRESH_EXPIRATION:7776000000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

app:
  api-base-url: ${API_BASE_URL:https://api.sc.kpi.ua}
  contact-url: ${APP_CONTACT_URL:https://sc.kpi.ua}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: "SC-KPI API"
    description: "Student Council of KPI - Backend API (modular monolith)"

management:
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
