spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: sc-kpi-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sc_kpi}
    username: ${DB_USER:sc_kpi}
    password: ${DB_PASSWORD:sc_kpi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgZGV2ZWxvcG1lbnQgcHVycG9zZXMgb25seQ==}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  remember-me-refresh-expiration: ${JWT_REMEMBER_ME_REFRESH_EXPIRATION:7776000000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

app:
  api-base-url: ${API_BASE_URL:https://api.sc.kpi.ua}
  contact-url: ${APP_CONTACT_URL:https://sc.kpi.ua}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  password-reset:
    token-expiration: ${PASSWORD_RESET_TOKEN_EXPIRATION:3600000}
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3000}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/google}
      frontend-url: ${GOOGLE_FRONTEND_URL:http://localhost:3000}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
  mfa:
    totp:
      issuer: "SC-KPI"
      algorithm: SHA1
      digits: 6
      period: 30
    encryption-key: ${MFA_ENCRYPTION_KEY:dGhpcyBpcyBhIGRldiBlbmNyeXB0aW9uIGtleSAzMg==}
    token-expiration: ${MFA_TOKEN_EXPIRATION:300000}
    recovery-code-count: 10
    max-verification-attempts: 5
    enforcement:
      grace-period-days: 7
      required-tiers: 4,5
  notifications:
    sse-timeout-ms: ${NOTIFICATION_SSE_TIMEOUT:300000}
    sse-heartbeat-interval-ms: ${NOTIFICATION_SSE_HEARTBEAT:30000}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    email-max-retries: ${NOTIFICATION_EMAIL_MAX_RETRIES:3}
    cleanup:
      enabled: ${NOTIFICATION_CLEANUP_ENABLED:true}
      cron: ${NOTIFICATION_CLEANUP_CRON:0 0 3 * * ?}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: "SC-KPI API"
    description: "Student Council of KPI - Backend API (modular monolith)"

management:
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  storage-type: in-memory
  max-bucket-count: ${RATE_LIMIT_MAX_BUCKETS:100000}
  bucket-ttl-seconds: ${RATE_LIMIT_BUCKET_TTL:3600}
  rules-cache-ttl-seconds: ${RATE_LIMIT_CACHE_TTL:30}
  track-violations: true
  max-violation-entries: 10000
  whitelisted-ips: []
  excluded-patterns:
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
  tier-defaults:
    0: 30
    1: 60
    2: 120
    3: 180
    4: 240
    5: 600

feature-flags:
  cache-ttl-seconds: ${FEATURE_FLAGS_CACHE_TTL:30}
  overrides: {}
  defaults:
    auth.mfa.totp: true
    notifications.enabled: true
    notifications.email: true
    notifications.sse: true
    notifications.admin-broadcast: true
    rate-limiting.enabled: true
    rate-limiting.admin: true

server:
  port: ${SERVER_PORT:8080}
