spring:
  datasource:
    url: jdbc:h2:mem:sc_kpi_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25

app:
  password-reset:
    token-expiration: 3600000
    base-url: http://localhost:3000
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost:8080/api/v1/auth/oauth2/callback/google
      frontend-url: http://localhost:3000

feature-flags:
  cache-ttl-seconds: 0
  defaults:
    auth.oauth2.google: true
    auth.password-reset: true
    auth.registration: true
    notifications.telegram: false
    engagements.clubs: true
    engagements.projects: true
    council.departments: true
    documents.management: true
    user.partner-levels: true

logging:
  level:
    ua.kpi.sc: DEBUG
