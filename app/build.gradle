plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

springBoot {
    buildInfo()
}

dependencies {
    implementation project(':common')
    implementation project(':module-auth')
    implementation project(':module-user')
    implementation project(':module-engagements')
    implementation project(':module-council')
    implementation project(':module-document')
    implementation project(':module-notification')
    implementation project(':module-audit')
    implementation project(':module-feature-flag')
    implementation project(':module-rate-limit')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Workaround: swagger-core requires Jackson 2 classes (awaiting upstream Jackson 3 migration)
    // See: https://github.com/springdoc/springdoc-openapi/issues/3200
    runtimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    runtimeOnly 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    runtimeOnly 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
}

bootJar {
    archiveFileName = 'sc-kpi-api.jar'
}
