plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

springBoot {
    buildInfo()
}

dependencies {
    implementation project(':common')
    implementation project(':module-auth')
    implementation project(':module-user')
    implementation project(':module-engagements')
    implementation project(':module-council')
    implementation project(':module-document')
    implementation project(':module-notification')
    implementation project(':module-audit')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    archiveFileName = 'sc-kpi-api.jar'
}
