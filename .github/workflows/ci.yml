name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') }}

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/'
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') }}

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Upload bootJar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bootJar
          path: app/build/libs/*.jar
          retention-days: 5

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') }}

      - name: Run tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --continue --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 7

  smoke-tests:
    name: smoke-tests
    needs: [build, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: sc-kpi/sc-kpi-api-tests
          path: api-tests

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 120
        env:
          SPRING_PROFILES_ACTIVE: dev
          JWT_SECRET: ci-dummy-jwt-secret-that-is-long-enough-for-hmac

      - name: Wait for API health
        run: |
          timeout=120
          while [ $timeout -gt 0 ]; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          echo "API failed to become healthy within 120s"
          docker compose logs api --tail 50
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run smoke tests
        working-directory: api-tests
        run: ./gradlew test -Denv=ci --no-daemon

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-results
          path: api-tests/build/allure-results/
          retention-days: 7

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: api-tests/build/reports/tests/
          retention-days: 7

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api --tail 200

      - name: Cleanup
        if: always()
        run: docker compose down -v

  dependency-submission:
    name: dependency-submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/dependency-submission@v4
