name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') }}

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/'
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') }}

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Upload bootJar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bootJar
          path: app/build/libs/*.jar
          retention-days: 5

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') }}

      - name: Run tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --continue --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 7

      - name: Publish Unit Test results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/build/test-results/test/**/*.xml'
          check_name: Unit Test Results
          comment_title: Unit Tests
          commit: ${{ github.event.pull_request.head.sha }}

  integration-smoke-tests:
    name: integration-smoke-tests
    needs: [build, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: sc-kpi/sc-kpi-api-tests
          path: api-tests

      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 180
        env:
          SPRING_PROFILES_ACTIVE: dev
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Wait for API health
        run: |
          timeout=120
          while [ $timeout -gt 0 ]; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          echo "API failed to become healthy within 120s"
          docker compose logs api --tail 50
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run smoke tests
        working-directory: api-tests
        run: ./gradlew test -Denv=ci --no-daemon

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-smoke-allure-results
          path: api-tests/build/allure-results/
          retention-days: 7

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-smoke-test-reports
          path: api-tests/build/reports/tests/
          retention-days: 7

      - name: Publish API Smoke Test results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: api-tests/build/test-results/test/**/*.xml
          check_name: Integration Smoke Test Results
          comment_title: API Smoke Tests
          commit: ${{ github.event.pull_request.head.sha }}

      - name: Checkout gh-pages for Allure history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.13
        with:
          allure_results: api-tests/build/allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Fix Allure report permissions
        if: always()
        run: sudo rm -rf allure-history/.git

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Post Allure report link on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const reportUrl = 'https://sc-kpi.github.io/sc-kpi-api/';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- allure-report-comment -->';
            const body = [
              marker,
              '## :bar_chart: Allure Test Report',
              '',
              `**Report:** ${reportUrl}`,
              `**Workflow run:** ${runUrl}`,
              `_Updated: ${new Date().toISOString()}_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api --tail 200

      - name: Cleanup
        if: always()
        run: docker compose down -v

  dependency-submission:
    name: dependency-submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/dependency-submission@v4
